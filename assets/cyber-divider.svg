<svg
  width="1000"
  height="46"
  viewBox="0 0 1000 46"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7DD3FC" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#E6EDF3" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line
    x1="40"
    y1="23"
    x2="960"
    y2="23"
    stroke="url(#lineGradient)"
    stroke-width="1.3"
  />

  <line
    x1="300"
    y1="18"
    x2="700"
    y2="18"
    stroke="#7DD3FC"
    stroke-opacity="0.12"
  />

  <line
    x1="360"
    y1="28"
    x2="640"
    y2="28"
    stroke="#A78BFA"
    stroke-opacity="0.10"
  />

  <circle
    cx="70"
    cy="23"
    r="3"
    fill="#7DD3FC"
    filter="url(#glow)"
  >
    <animate
      attributeName="cx"
      values="70;930;70"
      dur="6s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0;1;1;0"
      dur="6s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="930"
    cy="23"
    r="2"
    fill="#A78BFA"
    filter="url(#glow)"
  >
    <animate
      attributeName="cx"
      values="930;70;930"
      dur="8s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="500" cy="23" r="2.5" fill="#E6EDF3">
    <animate
      attributeName="opacity"
      values="0.25;1;0.25"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="34"
    y="17"
    fill="#8B949E"
    font-family="monospace"
    font-size="10"
  >
    &lt;/&gt;
  </text>

  <text
    x="942"
    y="37"
    fill="#8B949E"
    font-family="monospace"
    font-size="10"
  >
    01
  </text>
</svg>
