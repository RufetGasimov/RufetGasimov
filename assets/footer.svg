<svg
  width="1000"
  height="100"
  viewBox="0 0 1000 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
  <defs>
    <linearGradient id="footerGradient" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7DD3FC" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#E6EDF3"/>
      <stop offset="75%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>

    <filter id="footerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path
      id="motionPath"
      d="M40 55
         C170 15, 270 90, 400 50
         C530 10, 650 85, 770 50
         C860 20, 910 35, 960 55"
    />
  </defs>

  <use
    href="#motionPath"
    stroke="url(#footerGradient)"
    stroke-width="1.5"
    fill="none"
  />

  <use
    href="#motionPath"
    stroke="#7DD3FC"
    stroke-opacity="0.08"
    stroke-width="6"
    fill="none"
  />

  <circle
    r="4"
    fill="#7DD3FC"
    filter="url(#footerGlow)"
  >
    <animateMotion
      dur="5s"
      repeatCount="indefinite"
    >
      <mpath xlink:href="#motionPath"/>
    </animateMotion>
  </circle>

  <circle
    r="3"
    fill="#A78BFA"
    filter="url(#footerGlow)"
  >
    <animateMotion
      dur="7s"
      begin="-3s"
      repeatCount="indefinite"
    >
      <mpath xlink:href="#motionPath"/>
    </animateMotion>
  </circle>

  <circle cx="500" cy="50" r="2.5" fill="#E6EDF3">
    <animate
      attributeName="opacity"
      values="0.15;1;0.15"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
