<svg width="420" height="330"
     viewBox="0 0 420 330"
     xmlns="http://www.w3.org/2000/svg">

<style>
    .chain {
        stroke: #8b949e;
        stroke-width: 2;
        fill: none;
        opacity: 0.85;
    }

    .chain-link {
        fill: none;
        stroke: #8b949e;
        stroke-width: 1.5;
    }

    .anchor {
        fill: #ffffff;
    }

    .moon-group {
        transform-origin: 125px 35px;
        animation:
            moonSwing 3.6s ease-in-out infinite,
            moonGlow 2s ease-in-out infinite alternate;
    }

    .sun-group {
        transform-origin: 295px 35px;
        animation:
            sunSwing 3.6s ease-in-out infinite,
            sunGlow 2s ease-in-out infinite alternate;
    }

    .moon-main {
        fill: #ffffff;
    }

    .moon-cut {
        fill: #0d1117;
    }

    .sun-core {
        fill: #FFD43B;
    }

    .sun-inner {
        fill: #FFF1A8;
    }

    .sun-ray {
        stroke: #FFD43B;
        stroke-width: 3;
        stroke-linecap: round;
    }

    @keyframes moonSwing {
        0%   { transform: rotate(-8deg); }
        50%  { transform: rotate(8deg); }
        100% { transform: rotate(-8deg); }
    }

    @keyframes sunSwing {
        0%   { transform: rotate(8deg); }
        50%  { transform: rotate(-8deg); }
        100% { transform: rotate(8deg); }
    }

    @keyframes moonGlow {
        from {
            filter: drop-shadow(0 0 2px #ffffff);
        }

        to {
            filter: drop-shadow(0 0 10px #ffffff);
        }
    }

    @keyframes sunGlow {
        from {
            filter: drop-shadow(0 0 3px #FFD43B);
        }

        to {
            filter: drop-shadow(0 0 14px #FFD43B);
        }
    }
</style>

<!-- Moon anchor -->
<circle class="anchor" cx="125" cy="35" r="4"/>

<!-- Sun anchor -->
<circle class="anchor" cx="295" cy="35" r="4"/>

<!-- MOON -->
<g class="moon-group">

    <line class="chain"
          x1="125"
          y1="35"
          x2="125"
          y2="205"/>

    <ellipse class="chain-link" cx="125" cy="60" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="125" cy="80" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="125" cy="100" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="125" cy="120" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="125" cy="140" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="125" cy="160" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="125" cy="180" rx="5" ry="9"/>

    <g transform="translate(125 235)">
        <circle class="moon-main"
                cx="0"
                cy="0"
                r="38"/>

        <circle class="moon-cut"
                cx="17"
                cy="-10"
                r="37"/>
    </g>

</g>

<!-- SUN -->
<g class="sun-group">

    <line class="chain"
          x1="295"
          y1="35"
          x2="295"
          y2="205"/>

    <ellipse class="chain-link" cx="295" cy="60" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="295" cy="80" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="295" cy="100" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="295" cy="120" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="295" cy="140" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="295" cy="160" rx="5" ry="9"/>
    <ellipse class="chain-link" cx="295" cy="180" rx="5" ry="9"/>

    <g transform="translate(295 235)">

        <line class="sun-ray" x1="0" y1="-58" x2="0" y2="-48"/>
        <line class="sun-ray" x1="0" y1="58" x2="0" y2="48"/>

        <line class="sun-ray" x1="-58" y1="0" x2="-48" y2="0"/>
        <line class="sun-ray" x1="58" y1="0" x2="48" y2="0"/>

        <line class="sun-ray" x1="-41" y1="-41" x2="-34" y2="-34"/>
        <line class="sun-ray" x1="41" y1="-41" x2="34" y2="-34"/>

        <line class="sun-ray" x1="-41" y1="41" x2="-34" y2="34"/>
        <line class="sun-ray" x1="41" y1="41" x2="34" y2="34"/>

        <circle class="sun-core"
                cx="0"
                cy="0"
                r="34"/>

        <circle class="sun-inner"
                cx="0"
                cy="0"
                r="18"/>

    </g>

</g>

</svg>
