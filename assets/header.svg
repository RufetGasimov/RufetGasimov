<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">

  <defs>
    <linearGradient id="waveColor" x1="0" x2="1">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="35%" stop-color="#1f6feb"/>
      <stop offset="65%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text 1 -->
    <clipPath id="text1Clip">
      <rect x="170" y="90" width="0" height="90">
        <animate
          attributeName="width"
          dur="18s"
          repeatCount="indefinite"
          values="0;860;860;0;0;0;0"
          keyTimes="0;0.15;0.22;0.28;0.29;0.60;1"/>
      </rect>
    </clipPath>

    <!-- Text 2 -->
    <clipPath id="text2Clip">
      <rect x="170" y="90" width="0" height="90">
        <animate
          attributeName="width"
          dur="18s"
          repeatCount="indefinite"
          values="0;0;0;860;860;0;0"
          keyTimes="0;0.29;0.34;0.48;0.56;0.63;1"/>
      </rect>
    </clipPath>

    <!-- Text 3 -->
    <clipPath id="text3Clip">
      <rect x="120" y="90" width="0" height="90">
        <animate
          attributeName="width"
          dur="18s"
          repeatCount="indefinite"
          values="0;0;0;0;0;960;960"
          keyTimes="0;0.63;0.67;0.86;0.90;0.98;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="#010409"/>

  <!-- top wave -->
  <path
    fill="none"
    stroke="url(#waveColor)"
    stroke-width="3"
    opacity="0.95"
    filter="url(#glow)">
    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 35 C170 5 330 70 500 30 S830 10 1010 35 S1135 60 1200 25;
      M0 28 C170 55 330 5 500 42 S830 68 1010 24 S1135 8 1200 38;
      M0 35 C170 5 330 70 500 30 S830 10 1010 35 S1135 60 1200 25"/>
  </path>

  <path
    fill="none"
    stroke="#58a6ff"
    stroke-width="1.4"
    opacity="0.45">
    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M0 52 C180 18 360 78 530 40 S850 12 1030 52 S1148 70 1200 45;
      M0 62 C185 88 365 12 535 58 S855 86 1030 36 S1148 18 1200 58;
      M0 52 C180 18 360 78 530 40 S850 12 1030 52 S1148 70 1200 45"/>
  </path>

  <!-- small name -->
  <text
    x="80"
    y="70"
    font-family="Consolas, Courier New, monospace"
    font-size="24"
    fill="#c9d1d9">RufetGasimov / README.md</text>

  <!-- animated text line 1 -->
  <text
    x="600"
    y="170"
    text-anchor="middle"
    font-family="Georgia, Times New Roman, serif"
    font-size="48"
    font-weight="700"
    letter-spacing="2.5"
    fill="#58a6ff"
    filter="url(#glow)"
    clip-path="url(#text1Clip)">
    The world is yours.
  </text>

  <!-- animated text line 2 -->
  <text
    x="600"
    y="170"
    text-anchor="middle"
    font-family="Georgia, Times New Roman, serif"
    font-size="52"
    font-weight="700"
    letter-spacing="2.5"
    fill="#58a6ff"
    filter="url(#glow)"
    clip-path="url(#text2Clip)">
    Rufet Gasimov
  </text>

  <!-- animated text line 3 -->
  <text
    x="600"
    y="170"
    text-anchor="middle"
    font-family="Georgia, Times New Roman, serif"
    font-size="56"
    font-weight="700"
    letter-spacing="3"
    fill="#58a6ff"
    filter="url(#glow)"
    clip-path="url(#text3Clip)">
    Backend Developer
  </text>

  <line x1="70" y1="255" x2="1130" y2="255" stroke="#1f6feb" stroke-width="1.5"/>
</svg>
